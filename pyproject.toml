[project]
name = "mangadex-dl-gtk"
version = "0.1.0"
description = "Interface GTK para o mangadex-downloader."
requires-python = ">=3.10"
dependencies = ["PyGObject"]
readme = "README.md"

[project.scripts]
mangadex-dl-gtk = "app:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
